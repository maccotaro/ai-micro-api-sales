<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>提案書テンプレート設定 — デザインモック</title>
<style>
  :root{
    /* trinity of tonmana (editable via controls) */
    --cyan:#00A0E9; --navy:#003E73; --red:#E60012; --tint:#EAF6FC;
    --slide-font:'Hiragino Kaku Gothic ProN','Noto Sans JP','YuGothic',sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Noto Sans JP','Hiragino Kaku Gothic ProN',sans-serif;background:#f1f4f8;color:#1f2937;}
  header.app{background:#0f1f33;color:#fff;padding:14px 24px;display:flex;align-items:center;gap:18px;}
  header.app h1{font-size:17px;margin:0;font-weight:700;}
  header.app .sub{font-size:12px;color:#9fb3c8;}
  .presets{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .presets span{font-size:12px;color:#9fb3c8;}
  .preset{background:#1c3css;border:1px solid #2c4straps;}
  .preset{background:#16263b;border:1px solid #2e4straps;color:#cfe0f0;border-radius:16px;padding:5px 14px;font-size:12px;cursor:pointer;border:1px solid #2e4a66;}
  .preset.active{background:var(--cyan);border-color:var(--cyan);color:#fff;font-weight:700;}
  .layout{display:flex;height:calc(100vh - 52px);}
  /* ---- control panel ---- */
  .panel{width:380px;min-width:380px;background:#fff;border-right:1px solid #dde4ec;overflow-y:auto;padding:0 0 40px;}
  .group{border-bottom:1px solid #eef1f5;}
  .group > .gh{display:flex;align-items:center;gap:10px;padding:16px 20px;cursor:pointer;font-weight:700;font-size:14px;color:var(--navy);}
  .group > .gh .nbadge{width:22px;height:22px;border-radius:50%;background:var(--cyan);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
  .group .body{padding:4px 20px 20px;}
  .field{margin:14px 0;}
  .field label{display:block;font-size:12px;color:#5b6b7c;margin-bottom:6px;font-weight:600;}
  .colorrow{display:flex;gap:10px;}
  .coloritem{flex:1;text-align:center;}
  .coloritem input[type=color]{width:100%;height:34px;border:1px solid #d4dde6;border-radius:6px;background:#fff;cursor:pointer;padding:2px;}
  .coloritem .cap{font-size:10px;color:#7c8a99;margin-top:3px;}
  select,input[type=text]{width:100%;padding:8px 10px;border:1px solid #d4dde6;border-radius:6px;font-size:13px;background:#fff;}
  .seg{display:flex;border:1px solid #d4dde6;border-radius:6px;overflow:hidden;}
  .seg button{flex:1;border:0;background:#fff;padding:8px 4px;font-size:12px;cursor:pointer;color:#5b6b7c;}
  .seg button.active{background:var(--cyan);color:#fff;font-weight:700;}
  .switchrow{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:5px 0;}
  /* structure list */
  .seclist{list-style:none;margin:0;padding:0;}
  .seclist li{display:flex;align-items:center;gap:8px;padding:9px 10px;border:1px solid #e4eaf0;border-radius:8px;margin:7px 0;background:#fff;font-size:13px;}
  .seclist li.off{opacity:.45;}
  .seclist li .grip{color:#b6c2cf;cursor:grab;}
  .seclist li .nm{flex:1;}
  .seclist li .tag{font-size:10px;background:#eef1f5;color:#7c8a99;border-radius:4px;padding:1px 6px;}
  .seclist li .mv{border:0;background:#eef3f8;border-radius:5px;width:22px;height:22px;cursor:pointer;color:#5b6b7c;}
  .seclist li input[type=checkbox]{width:16px;height:16px;}
  /* ---- preview ---- */
  .preview{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .pv-toolbar{padding:12px 20px;background:#fff;border-bottom:1px solid #dde4ec;display:flex;gap:8px;align-items:center;}
  .pv-toolbar .t{font-size:13px;color:#5b6b7c;font-weight:600;margin-right:8px;}
  .pv-toolbar button{border:1px solid #d4dde6;background:#fff;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;color:#42536b;}
  .pv-toolbar button.active{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;}
  .pv-stage{flex:1;overflow:auto;padding:32px;display:flex;justify-content:center;align-items:flex-start;}
  /* slide canvas 16:9 */
  .slide{width:960px;height:540px;background:#fff;box-shadow:0 8px 30px rgba(15,40,70,.18);border-radius:6px;position:relative;overflow:hidden;font-family:var(--slide-font);color:#222;flex:0 0 auto;}
  .slide .logo{position:absolute;top:10px;right:18px;font-size:11px;font-weight:700;color:#fff;opacity:.9;z-index:5;}
  .slide .foot{position:absolute;bottom:10px;left:24px;font-size:10px;color:#9bb3c7;}
  .slide .pageno{position:absolute;bottom:10px;right:18px;font-size:10px;color:var(--navy);}
  /* header variants */
  .slide .h1bar{font-size:22px;font-weight:700;color:#fff;background:var(--cyan);padding:14px 28px;}
  .hs-underline .h1bar{background:transparent;color:var(--navy);border-bottom:3px solid var(--cyan);margin:14px 28px 0;padding:6px 0;}
  .hs-side .h1bar{background:transparent;color:var(--navy);border-left:10px solid var(--cyan);margin:18px 0 0;padding:4px 24px;}
  .slide.bg-tint{background:var(--tint);}
  .body-pad{padding:24px 28px;}
  /* cover */
  .cover{display:flex;flex-direction:column;justify-content:center;height:100%;padding:0 56px;}
  .cover h1{font-size:38px;color:var(--navy);border-left:10px solid var(--cyan);padding-left:22px;margin:0 0 10px;}
  .cover h2{font-size:20px;color:var(--cyan);padding-left:22px;margin:0;font-weight:600;}
  /* 3 strategy cards */
  .cards{display:flex;gap:16px;}
  .card{flex:1;border:1px solid var(--cyan);border-radius:var(--radius);padding:16px;background:#fff;min-height:300px;}
  .card .num{width:30px;height:30px;line-height:30px;border-radius:50%;background:var(--cyan);color:#fff;text-align:center;font-weight:700;}
  .card .ttl{color:var(--navy);font-weight:700;font-size:17px;margin:8px 0;}
  .card .body{font-size:12px;color:#444;line-height:1.6;}
  .chip{display:inline-block;border:1px solid var(--cyan);border-radius:12px;padding:2px 9px;font-size:11px;color:var(--navy);margin:8px 4px 0 0;}
  .copyline{margin-top:10px;font-size:12px;color:var(--red);font-weight:600;}
  .concl{text-align:center;color:var(--cyan);font-weight:700;border-top:2px solid var(--cyan);margin-top:14px;padding-top:8px;}
  /* plan cards */
  .plans{display:flex;gap:18px;}
  .plan{flex:1;position:relative;border:1px solid #d6e6f2;border-radius:var(--radius);padding:18px 16px;background:#fff;min-height:300px;}
  .plan.rec{border:2px solid var(--cyan);background:var(--tint);}
  .plan .badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 14px;border-radius:12px;}
  .plan .grade{width:44px;height:44px;line-height:44px;border-radius:50%;background:var(--navy);color:#fff;text-align:center;font-weight:700;font-size:20px;margin:0 auto 10px;}
  .plan.rec .grade{background:var(--cyan);}
  .plan .price{text-align:center;font-size:24px;font-weight:700;color:var(--navy);margin-bottom:12px;}
  .plan.rec .price{color:var(--red);}
  .plan .pitem{display:flex;justify-content:space-between;font-size:12px;color:#444;margin:7px 0;border-top:1px solid #eef2f6;padding-top:7px;}
  .hint{font-size:11px;color:#9aa7b5;margin-top:6px;}
  /* ===== additional slide component samples (ported from brand_theme) ===== */
  .slide h2{color:var(--navy);font-size:16px;border-bottom:2px solid var(--cyan);padding-bottom:4px;margin:6px 0 10px;}
  ol.agenda{list-style:none;padding:0;margin:8px 0 0;}
  ol.agenda li{display:flex;align-items:center;gap:12px;margin:13px 0;font-size:17px;color:var(--navy);font-weight:600;}
  ol.agenda .num{width:34px;height:34px;line-height:34px;border-radius:50%;background:var(--cyan);color:#fff;text-align:center;font-weight:700;font-size:14px;}
  .cols{display:flex;gap:24px;margin-top:6px;}
  .cols .col{flex:1;}
  .colhead{background:var(--navy);color:#fff;font-weight:700;padding:8px 12px;border-radius:6px;text-align:center;font-size:14px;}
  .step{border:1px solid #cfe6f4;border-radius:8px;padding:9px 12px;margin:9px 0;}
  .step .tt{color:var(--navy);font-weight:700;font-size:13px;}
  .step .dd{font-size:12px;color:#555;}
  .arrow{text-align:center;color:var(--cyan);font-size:15px;margin:-3px 0;}
  .cmp{display:flex;gap:18px;margin-top:14px;}
  .cmp .col{flex:1;border-radius:8px;padding:16px 18px;}
  .cmp .col.left{background:#eef0f2;}
  .cmp .col.right{background:var(--tint);}
  .cmp .col .head{font-weight:700;margin-bottom:8px;color:var(--navy);}
  .cmp .col.right .head{color:var(--cyan);}
  .cmp ul{margin:0;padding-left:18px;font-size:13px;line-height:1.8;}
  table.cmpt{width:100%;border-collapse:collapse;margin-top:14px;font-size:13px;}
  table.cmpt th{background:var(--navy);color:#fff;padding:8px 10px;text-align:left;}
  table.cmpt td{padding:7px 10px;border-bottom:1px solid #d6e6f2;}
  table.cmpt tr:nth-child(even) td{background:var(--tint);}
  .axisrow{display:flex;align-items:stretch;gap:14px;margin:14px 0;}
  .axisrow .axname{flex:0 0 200px;background:var(--navy);color:#fff;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:12px;text-align:center;font-size:14px;}
  .axisrow .axdetail{flex:1.2;background:#fff;border:1px solid #d6e6f2;border-radius:8px;padding:11px 14px;font-size:13px;color:#444;}
  .axisrow .axar{display:flex;align-items:center;color:var(--cyan);font-weight:700;font-size:18px;}
  .axisrow .axappeal{flex:1.2;background:var(--tint);border:1px solid var(--cyan);border-radius:8px;padding:11px 14px;font-size:13px;color:var(--navy);font-weight:600;}
  .cap{font-size:10px;font-weight:700;color:var(--cyan);margin-bottom:4px;}
  .lead-psy{background:#fff;border-left:6px solid var(--cyan);padding:12px 18px;margin:14px 0;font-size:15px;color:var(--navy);box-shadow:0 1px 4px rgba(0,62,115,.08);}
  .lead-psy .lbl{color:var(--cyan);font-weight:700;margin-right:8px;}
  .para{display:flex;align-items:center;gap:14px;background:var(--tint);border-radius:8px;padding:16px;margin:16px 0;font-size:16px;}
  .para .old{background:#e3e7ea;padding:10px 16px;border-radius:6px;font-weight:700;color:#555;}
  .para .new{background:#fff;border:2px solid var(--cyan);padding:10px 16px;border-radius:6px;font-weight:700;color:var(--navy);}
  .para .ar{color:var(--cyan);font-weight:700;}
  .merits{display:flex;gap:14px;margin:16px 0;}
  .merit{flex:1;border:1px solid var(--cyan);border-top:4px solid var(--cyan);border-radius:8px;text-align:center;padding:18px 6px;font-weight:700;color:var(--navy);font-size:15px;}
  .cc{background:var(--tint);border-radius:8px;padding:16px 20px;}
  .cc .h{color:var(--cyan);font-weight:700;margin-bottom:8px;}
  .cc ul{margin:0;padding-left:18px;}
  .cc li{margin:8px 0;}.cc li .ct{color:var(--navy);font-weight:700;}.cc li .rs{display:block;font-size:12px;color:#5a6b7a;}
  .ba{display:flex;gap:16px;align-items:stretch;margin-top:18px;}
  .ba .col{flex:1;border:1px solid #d6e6f2;border-radius:8px;padding:22px 24px;}
  .ba .col.after{border:2px solid var(--cyan);background:var(--tint);}
  .ba .col .head{font-weight:700;color:var(--navy);font-size:18px;margin-bottom:6px;}
  .ba .col.after .head{color:var(--cyan);}
  .ba .metric{font-size:13px;color:#444;margin-bottom:10px;}
  .ba .kpis{display:flex;gap:36px;justify-content:center;margin-top:14px;}
  .ba .kpi{text-align:center;}
  .ba .kv{font-size:40px;font-weight:700;color:#666;line-height:1.1;}
  .ba .kv.big{font-size:50px;color:var(--red);}
  .ba .col.after .kv{color:var(--navy);}.ba .col.after .kv.big{color:var(--red);}
  .ba .kl{font-size:12px;color:#888;}
  .ba-ar{display:flex;align-items:center;color:var(--cyan);font-weight:700;font-size:28px;}
  .improve{background:var(--tint);border-left:6px solid var(--red);border-radius:0 8px 8px 0;padding:16px 20px;margin-top:20px;font-size:15px;color:#37506b;}
  .improve .lbl{color:var(--red);font-weight:700;margin-right:10px;}
  .kwcols{display:flex;gap:18px;margin-top:16px;}
  .kwcol{flex:1;border:1px solid #d6e6f2;border-radius:var(--radius);padding:0 0 16px;background:#fff;overflow:hidden;}
  .kwcol .kwhead{background:var(--navy);color:#fff;font-weight:700;padding:12px 14px;font-size:14px;}
  .kwcol .kwlbl{font-size:10px;font-weight:700;color:var(--cyan);margin:14px 14px 6px;}
  .kwchips{padding:0 14px;}
  .kwchip{display:inline-block;background:var(--tint);border:1px solid var(--cyan);border-radius:12px;padding:3px 10px;font-size:11px;color:var(--navy);margin:0 4px 6px 0;}
  .kwcopy{margin:6px 14px 0;font-size:12px;color:var(--red);font-weight:600;}
  .nscols{display:flex;gap:18px;margin-top:16px;}
  .nscol{flex:1;border:1px solid #d6e6f2;border-radius:var(--radius);overflow:hidden;background:#fff;}
  .nscol .nshead{background:var(--navy);color:#fff;font-weight:700;padding:11px 16px;font-size:15px;}
  .nscol .nshead.na{background:var(--cyan);}
  .nslist{list-style:none;margin:0;padding:14px 16px;}
  .nslist li{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#333;margin:10px 0;}
  .nstag{background:#eef0f2;color:var(--navy);font-size:10px;font-weight:700;border-radius:4px;padding:2px 8px;}
  .nstag.tagp{background:var(--red);color:#fff;}
  .nsacts{list-style:none;margin:0;padding:14px 16px;}
  .nsacts li{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:#333;margin:12px 0;}
  .nsnum{flex:0 0 26px;width:26px;height:26px;line-height:26px;text-align:center;border-radius:50%;background:var(--cyan);color:#fff;font-weight:700;font-size:13px;}
  .nspri{font-size:10px;font-weight:700;border-radius:4px;padding:1px 8px;margin-left:8px;}
  .nspri.h{background:var(--red);color:#fff;}.nspri.m{background:var(--tint);color:var(--navy);border:1px solid var(--cyan);}.nspri.l{background:#eef0f2;color:#777;}
</style>
</head>
<body>
<header class="app">
  <h1>提案書テンプレート設定</h1>
  <span class="sub">トンマナ・マスタースライド・構成を一画面で。右はライブプレビュー（モック）</span>
  <div class="presets">
    <span>プリセット:</span>
    <button class="preset active" data-preset="simple">シンプル</button>
    <button class="preset" data-preset="impact">インパクト</button>
    <button class="preset" data-preset="corp">コーポレート</button>
  </div>
</header>

<div class="layout">
  <!-- ============ CONTROL PANEL ============ -->
  <div class="panel">

    <!-- (1) トンマナ -->
    <div class="group">
      <div class="gh"><span class="nbadge">1</span>トンマナ（色・フォント）</div>
      <div class="body">
        <div class="field">
          <label>ブランドカラー</label>
          <div class="colorrow">
            <div class="coloritem"><input type="color" id="c-cyan" value="#00A0E9"><div class="cap">メイン</div></div>
            <div class="coloritem"><input type="color" id="c-navy" value="#003E73"><div class="cap">濃色</div></div>
            <div class="coloritem"><input type="color" id="c-red" value="#E60012"><div class="cap">強調</div></div>
            <div class="coloritem"><input type="color" id="c-tint" value="#EAF6FC"><div class="cap">淡背景</div></div>
          </div>
        </div>
        <div class="field">
          <label>フォント</label>
          <select id="f-font">
            <option value="'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif">ヒラギノ角ゴ / Noto Sans JP（標準）</option>
            <option value="'Noto Serif JP',serif">Noto Serif JP（明朝・信頼感）</option>
            <option value="'M PLUS Rounded 1c',sans-serif">M PLUS Rounded（やわらかい）</option>
          </select>
        </div>
        <div class="field">
          <label>ロゴ</label>
          <input type="text" id="f-logo" value="MyNavi" placeholder="ロゴ画像URL または テキスト">
          <div class="hint">※実装ではPNG/SVGアップロード対応</div>
        </div>
      </div>
    </div>

    <!-- (2) マスタースライド -->
    <div class="group">
      <div class="gh"><span class="nbadge">2</span>マスタースライド</div>
      <div class="body">
        <div class="field">
          <label>見出しスタイル</label>
          <div class="seg" id="seg-header">
            <button data-v="bar" class="active">シアン帯</button>
            <button data-v="underline">下線</button>
            <button data-v="side">サイド罫</button>
          </div>
        </div>
        <div class="field">
          <label>背景</label>
          <div class="seg" id="seg-bg">
            <button data-v="white" class="active">白</button>
            <button data-v="tint">淡色</button>
          </div>
        </div>
        <div class="field">
          <label>角丸</label>
          <div class="seg" id="seg-radius">
            <button data-v="4" >シャープ</button>
            <button data-v="10" class="active">標準</button>
            <button data-v="18">丸め</button>
          </div>
        </div>
        <div class="switchrow"><span>ロゴを表示</span><input type="checkbox" id="sw-logo" checked></div>
        <div class="switchrow"><span>フッター（資料名）</span><input type="checkbox" id="sw-foot" checked></div>
        <div class="switchrow"><span>ページ番号</span><input type="checkbox" id="sw-page" checked></div>
      </div>
    </div>

    <!-- (3) スライド構成 -->
    <div class="group">
      <div class="gh"><span class="nbadge">3</span>スライド構成（並べ替え・ON/OFF）</div>
      <div class="body">
        <ul class="seclist" id="seclist"></ul>
        <div class="hint">ドラッグまたは ↑↓ で並べ替え。チェックを外すと生成対象から除外。</div>
      </div>
    </div>

  </div>

  <!-- ============ PREVIEW ============ -->
  <div class="preview">
    <div class="pv-toolbar">
      <span class="t">プレビュー:</span>
      <button class="active" data-slide="cover">表紙</button>
      <button data-slide="agenda">本日の流れ</button>
      <button data-slide="principles">原稿設計の重要性</button>
      <button data-slide="misconception">イメージと実態</button>
      <button data-slide="segment">類似職種の違い</button>
      <button data-slide="psychology">ターゲット心理</button>
      <button data-slide="strategy">戦略3カード</button>
      <button data-slide="detail">戦略の詳細</button>
      <button data-slide="plan">料金プラン</button>
      <button data-slide="keyword">キーワード設計</button>
      <button data-slide="success">成功事例</button>
      <button data-slide="next">次のステップ</button>
    </div>
    <div class="pv-stage">
      <div class="slide" id="slide"></div>
    </div>
  </div>
</div>

<script>
const SECTIONS = [
  {id:'cover',nm:'表紙',tag:'固定',on:true},
  {id:'agenda',nm:'本日の流れ',tag:'固定',on:true},
  {id:'principles',nm:'原稿設計の重要性',tag:'固定',on:true},
  {id:'misconception',nm:'イメージと実態',tag:'条件',on:true},
  {id:'segment',nm:'類似職種との違い',tag:'条件',on:true},
  {id:'psychology',nm:'ターゲット心理',tag:'条件',on:true},
  {id:'strategy_sum',nm:'戦略3カード',tag:'固定',on:true},
  {id:'strategy_det',nm:'各戦略の詳細',tag:'可変×N',on:true},
  {id:'plan',nm:'ご提案プラン（料金）',tag:'固定',on:true},
  {id:'keyword',nm:'キーワード設計',tag:'条件',on:true},
  {id:'success',nm:'成功事例',tag:'条件',on:true},
  {id:'next',nm:'次のステップ',tag:'固定',on:true},
];
const PRESETS = {
  simple:{cyan:'#00A0E9',navy:'#003E73',red:'#E60012',tint:'#EAF6FC',header:'bar',bg:'white',radius:'10'},
  impact:{cyan:'#0B7DD6',navy:'#0A2540',red:'#FF3B30',tint:'#E8F1FB',header:'side',bg:'tint',radius:'18'},
  corp:{cyan:'#1F8A70',navy:'#13343B',red:'#C0392B',tint:'#EAF3F0',header:'underline',bg:'white',radius:'4'},
};
const S = {header:'bar',bg:'white',radius:'10',logo:true,foot:true,page:true,slide:'cover',logoText:'MyNavi'};

function setVar(k,v){document.documentElement.style.setProperty(k,v);}
function applyFont(){document.documentElement.style.setProperty('--slide-font',document.getElementById('f-font').value);}

function renderSecList(){
  const ul=document.getElementById('seclist');ul.innerHTML='';
  SECTIONS.forEach((s,i)=>{
    const li=document.createElement('li');li.className=s.on?'':'off';
    li.innerHTML=`<span class="grip">⋮⋮</span>
      <input type="checkbox" ${s.on?'checked':''} data-i="${i}">
      <span class="nm">${s.nm}</span><span class="tag">${s.tag}</span>
      <button class="mv" data-up="${i}">↑</button><button class="mv" data-dn="${i}">↓</button>`;
    ul.appendChild(li);
  });
  ul.querySelectorAll('input[type=checkbox]').forEach(c=>c.onchange=e=>{SECTIONS[e.target.dataset.i].on=e.target.checked;renderSecList();});
  ul.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;if(i>0){[SECTIONS[i-1],SECTIONS[i]]=[SECTIONS[i],SECTIONS[i-1]];renderSecList();}});
  ul.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;if(i<SECTIONS.length-1){[SECTIONS[i+1],SECTIONS[i]]=[SECTIONS[i],SECTIONS[i+1]];renderSecList();}});
}

function chrome(inner,title){
  const hs='hs-'+S.header;
  const bg=S.bg==='tint'?'bg-tint':'';
  const logo=S.logo?`<div class="logo">${S.logoText}</div>`:'';
  const foot=S.foot?`<div class="foot">IDOM 採用成功に向けたご提案</div>`:'';
  const page=S.page?`<div class="pageno">7</div>`:'';
  return `<div class="h1bar">${title}</div><div class="body-pad">${inner}</div>${logo}${foot}${page}`;
}

// ---- wiring ----
['cyan','navy','red','tint'].forEach(k=>{
  document.getElementById('c-'+k).oninput=e=>{setVar('--'+k,e.target.value);renderSlide();};
});
document.getElementById('f-font').onchange=()=>{applyFont();};
document.getElementById('f-logo').oninput=e=>{S.logoText=e.target.value;renderSlide();};
function segWire(id,key){document.querySelectorAll('#'+id+' button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#'+id+' button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  if(key==='radius'){S.radius=b.dataset.v;setVar('--radius',b.dataset.v+'px');}else{S[key]=b.dataset.v;}renderSlide();});}
segWire('seg-header','header');segWire('seg-bg','bg');segWire('seg-radius','radius');
document.getElementById('sw-logo').onchange=e=>{S.logo=e.target.checked;renderSlide();};
document.getElementById('sw-foot').onchange=e=>{S.foot=e.target.checked;renderSlide();};
document.getElementById('sw-page').onchange=e=>{S.page=e.target.checked;renderSlide();};
document.querySelectorAll('.pv-toolbar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.pv-toolbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');S.slide=b.dataset.slide;renderSlide();});
document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.preset').forEach(x=>x.classList.remove('active'));b.classList.add('active');
  const p=PRESETS[b.dataset.preset];
  ['cyan','navy','red','tint'].forEach(k=>{setVar('--'+k,p[k]);document.getElementById('c-'+k).value=p[k];});
  S.header=p.header;S.bg=p.bg;S.radius=p.radius;setVar('--radius',p.radius+'px');
  document.querySelectorAll('#seg-header button').forEach(x=>x.classList.toggle('active',x.dataset.v===p.header));
  document.querySelectorAll('#seg-bg button').forEach(x=>x.classList.toggle('active',x.dataset.v===p.bg));
  document.querySelectorAll('#seg-radius button').forEach(x=>x.classList.toggle('active',x.dataset.v===p.radius));
  renderSlide();});

renderSecList();renderSlide();
</script>
